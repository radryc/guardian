# Guardian observed sync — GitLab CI template.
#
# Include this job in the repository that holds your CDK app, e.g.:
#   include:
#     - remote: 'https://raw.githubusercontent.com/rydzu/ainfra/main/guardian/docs/ci/gitlab-observed.yml'
# or copy the job into .gitlab-ci.yml.
#
# CI/CD variables to define (masked):
#   GUARDIAN_MONOFS_ROUTER  MonoFS router gRPC address (host:9090)
#   GUARDIAN_MONOFS_TOKEN   MonoFS guardian token
#   GUARDIAN_URL            (notify-only mode) Guardian UI/API base URL
#   GUARDIAN_TOKEN          (notify-only mode) machine token accepted by Guardian
#   MONOFS_HTTP             (notify-only mode) MonoFS router HTTP base URL
#
# The repository needs a .guardian/config.yaml (see docs/aws-observed.md) that
# declares the pusher and the partition binding.

guardian-observed-sync:
  stage: deploy
  image: golang:1.26
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables:
    GIT_DEPTH: "1"
  before_script:
    - apt-get update -qq && apt-get install -y -qq git curl nodejs npm >/dev/null
    - git clone --depth 1 https://github.com/rydzu/ainfra.git /tmp/strata
    - (cd /tmp/strata && go build -o /usr/local/bin/guardianctl ./guardian/cmd/guardianctl)
  script:
    # ── Mode 1 (recommended): apply repo config, synth, push bundle ──
    - guardianctl repo apply --dir . --synth

    # ── Mode 2 (alternative): notify MonoFS + Guardian, no local synth ──
    # - |
    #   curl -fsS -X POST "$MONOFS_HTTP/api/ingest" \
    #     -H "Authorization: Bearer $GUARDIAN_MONOFS_TOKEN" \
    #     --data-urlencode "source=$CI_PROJECT_URL.git" \
    #     --data-urlencode "ref=$CI_COMMIT_REF_NAME" \
    #     --data-urlencode "source_id=<monofs-display-path>" \
    #     --data-urlencode "ingestion_type=git"
    # - |
    #   curl -fsS -X POST "$GUARDIAN_URL/api/repos/<repo-name>/notify" \
    #     -H "Authorization: Bearer $GUARDIAN_TOKEN" \
    #     -H 'Content-Type: application/json' \
    #     -d "{\"commit\":\"$CI_COMMIT_SHA\",\"branch\":\"$CI_COMMIT_REF_NAME\"}"
