<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Forge — Guardian partition workbench</title>
    <script>
      (() => {
        let choice = "system";
        try {
          choice = localStorage.getItem("forge.theme") || "system";
        } catch {}
        const light =
          choice === "light" ||
          (choice === "system" && window.matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.dataset.theme = light ? "light" : "dark";
      })();
    </script>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark">F</span>
          <div>
            <strong>Forge</strong>
            <small>partition workbench</small>
          </div>
        </div>
        <div class="repo" id="repoInfo">loading repository…</div>
        <nav class="nav">
          <button data-tab="overview" class="active">Overview</button>
          <button data-tab="partition">Partition</button>
          <button data-tab="assets">Assets</button>
          <button data-tab="access">Access</button>
          <button data-tab="alerts">Alerts</button>
          <button data-tab="validate">Validate</button>
          <button data-tab="submit">Submit</button>
          <button data-tab="status">Status</button>
        </nav>
        <div class="section-label">Partitions</div>
        <div class="partition-list" id="partitionList"></div>
        <div class="sidebar-foot">
          <span id="displayBadge" class="badge hidden"></span>
          <small>Forge never writes Guardian state. Changes go through MonoFS review.</small>
        </div>
      </aside>
      <main class="main">
        <header class="topbar">
          <div>
            <h1 id="title">Overview</h1>
            <p id="subtitle" class="muted"></p>
          </div>
          <div class="topbar-actions">
            <div class="theme-control" id="themeControl">
              <button type="button" class="theme-button" id="themeButton" aria-haspopup="menu" aria-expanded="false" aria-label="Theme: system" title="Theme: system">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="3" y="4" width="18" height="13" rx="2" />
                  <path d="M8 21h8M12 17v4" />
                </svg>
              </button>
              <div class="theme-menu hidden" id="themeMenu" role="menu" aria-label="Theme">
                <button type="button" role="menuitemradio" data-theme-choice="system" aria-checked="false"><span>System</span><span class="check">✓</span></button>
                <button type="button" role="menuitemradio" data-theme-choice="light" aria-checked="false"><span>Light</span><span class="check">✓</span></button>
                <button type="button" role="menuitemradio" data-theme-choice="dark" aria-checked="false"><span>Dark</span><span class="check">✓</span></button>
              </div>
            </div>
            <div class="actions" id="topActions"></div>
          </div>
        </header>
        <div id="toast" class="toast hidden"></div>
        <section id="content" class="content"></section>
      </main>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
