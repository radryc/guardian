name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      MONOFS_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v7
        with:
          path: guardian
      - uses: actions/checkout@v7
        with:
          repository: radryc/kvs
          path: kvs
      - uses: actions/checkout@v7
        with:
          repository: radryc/monofs
          path: monofs
      - uses: actions/checkout@v7
        with:
          repository: radryc/cfg
          path: cfg
      - uses: actions/setup-go@v7
        with:
          go-version-file: guardian/go.mod
          cache-dependency-path: guardian/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: guardian/package-lock.json
      # internal/bootstrap tests render templates from the private stratatools
      # repo (ST_ROOT), so they cannot run against a plain public checkout.
      - name: Run tests
        working-directory: guardian
        run: go test $(go list ./... | grep -v '/internal/bootstrap$')
      - name: Vet
        working-directory: guardian
        run: go vet $(go list ./... | grep -v '/internal/bootstrap$')
      - name: Build UI
        working-directory: guardian
        run: npm ci && npm run build:ui
      - name: Vulnerability scan
        uses: golang/govulncheck-action@v1
        with:
          repo-checkout: false
          work-dir: guardian
