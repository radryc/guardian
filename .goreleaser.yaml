version: 2

project_name: forge

dist: dist

builds:
  - id: forge
    main: ./cmd/forge
    binary: forge
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s
      - -w

archives:
  - id: forge
    builds:
      - forge
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      - docs/design/forge.md
      - docs/forge/**

checksum:
  name_template: checksums.txt

changelog:
  disable: true
